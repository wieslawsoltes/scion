[package]
name = "scion-server"
description = "Authoritative authenticated Scion SCM API service and embeddable router"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
postgres = ["scion-store/postgres"]
cloud = ["dep:scion-store-cloud"]
spanner = ["dep:scion-store-spanner", "cloud"]

[dependencies]
scion-auth.workspace = true
scion-types.workspace = true
scion-store.workspace = true
scion-store-cloud = { workspace = true, optional = true }
scion-store-spanner = { workspace = true, optional = true }
scion-engine.workspace = true
scion-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
blake3.workspace = true
base64.workspace = true
parking_lot.workspace = true
tokio.workspace = true
axum.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower.workspace = true
tower-http.workspace = true

[dev-dependencies]
tempfile.workspace = true
scion-client.workspace = true
scion-cache.workspace = true
reqwest.workspace = true

[lints]
workspace = true
