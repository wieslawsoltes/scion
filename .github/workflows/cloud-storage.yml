name: Cloud storage

on:
  push:
    branches: [main]
    paths:
      - crates/scion-store/**
      - crates/scion-store-cloud/**
      - crates/scion-server/**
      - Cargo.toml
      - Cargo.lock
      - scripts/test-s3.py
      - .github/workflows/cloud-storage.yml
  pull_request:
    paths:
      - crates/scion-store/**
      - crates/scion-store-cloud/**
      - crates/scion-server/**
      - Cargo.toml
      - Cargo.lock
      - scripts/test-s3.py
      - .github/workflows/cloud-storage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  providers:
    name: Provider contracts and S3 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      GOMAXPROCS: "4"
      MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: false
      - name: Build pinned MinIO fixture from official source
        run: go install -p 4 github.com/minio/minio@${MINIO_VERSION}
      - name: Provider contracts, integrity, and runtime behavior
        run: cargo test -p scion-store-cloud --all-features --locked
      - name: Real S3 conditional-write and restart conformance
        run: python scripts/test-s3.py --minio "$(go env GOPATH)/bin/minio"
