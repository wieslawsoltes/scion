[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wieslawsoltes/scion"
homepage = "https://github.com/wieslawsoltes/scion"
authors = ["Scion contributors"]
keywords = ["scm", "version-control", "monorepo", "content-addressed"]
categories = ["development-tools"]

[workspace.dependencies]
scion-types = { path = "crates/scion-types", version = "0.1.0" }
scion-store = { path = "crates/scion-store", version = "0.1.0" }
scion-store-cloud = { path = "crates/scion-store-cloud", version = "0.1.0" }
scion-store-spanner = { path = "crates/scion-store-spanner", version = "0.1.0" }
scion-graph = { path = "crates/scion-graph", version = "0.1.0" }
scion-engine = { path = "crates/scion-engine", version = "0.1.0" }
scion-protocol = { path = "crates/scion-protocol", version = "0.1.0" }
scion-client = { path = "crates/scion-client", version = "0.1.0" }
scion-cache = { path = "crates/scion-cache", version = "0.1.0" }
scion-git = { path = "crates/scion-git", version = "0.1.0" }
scion-server = { path = "crates/scion-server", version = "0.1.0" }
scion-auth = { path = "crates/scion-auth", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
zstd = "0.13"
# 0.39 bundles SQLite 3.51.3, including the concurrent WAL-reset corruption fix.
rusqlite = { version = "0.39", features = ["bundled"] }
parking_lot = "0.12"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
base64 = "0.22"
similar = "2"
diffy = "0.4"
notify = "8"
ignore = "0.4"
futures = "0.3"
http = "1"
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "limit", "timeout", "request-id"] }
postgres = "0.19"
tokio-postgres-rustls = { version = "0.14", features = ["ring", "native-certs"] }
url = "2"
fs2 = "0.4"
libc = "0.2"
object_store = { version = "0.14.2", default-features = false }
bytes = "1"
google-cloud-spanner = "=0.34.4-preview"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
debug = true
